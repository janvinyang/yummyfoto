<script src="images/manifest.js"></script>

<script>
    function toggleMobileMenu() {
        document.getElementById('mobileMenu').classList.toggle('active');
    }

    const works = (typeof __GALLERY_MANIFEST__ !== 'undefined' && __GALLERY_MANIFEST__.works) ? __GALLERY_MANIFEST__.works : [];
    const categories = (typeof __GALLERY_MANIFEST__ !== 'undefined' && __GALLERY_MANIFEST__.categories) ? Object.values(__GALLERY_MANIFEST__.categories) : [];
    const articles = (typeof __ARTICLES__ !== 'undefined') ? __ARTICLES__ : [];

    let currentFilter = 'all';
    let lightboxIndex = 0;
    let visibleWorks = [];

    /* ---------- Works filter + grid ---------- */
    function buildFilter() {
        const filter = document.getElementById('worksFilter');
        const buttons = [{ key: 'all', label: '全部' }].concat(categories.map(c => ({ key: c.filter, label: c.label })));
        filter.innerHTML = buttons.map(b => `
            <button class="filter-btn${b.key === 'all' ? ' active' : ''}" data-filter="${b.key}">${b.label}</button>
        `).join('');

        filter.addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            filter.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderWorks();
        });
    }

    function renderWorks() {
        const grid = document.getElementById('worksGrid');
        visibleWorks = currentFilter === 'all' ? works : works.filter(w => w.category === currentFilter);

        document.getElementById('worksCount').textContent = String(visibleWorks.length).padStart(2, '0') + ' 件作品';

        if (visibleWorks.length === 0) {
            grid.innerHTML = '<p class="works-empty">暂无作品</p>';
            return;
        }

        const single = visibleWorks.map((work, i) => `
            <a class="work-card" href="${work.src}" data-index="${i}">
                <div class="work-media">
                    <img src="${work.src}" alt="${work.title}" loading="lazy">
                </div>

            </a>
        `).join('');

        grid.innerHTML = '<div class="works-track">' + single + single + '</div>';
    }

    /* ---------- Lightbox ---------- */
    function openLightbox(index) {
        lightboxIndex = index;
        updateLightbox();
        document.getElementById('lightbox').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('open');
        document.body.style.overflow = '';
    }

    function updateLightbox() {
        const work = visibleWorks[lightboxIndex];
        if (!work) return;
        document.getElementById('lightboxImg').src = work.src;
        document.getElementById('lightboxImg').alt = work.title;
    }

    function lightboxNav(dir) {
        if (visibleWorks.length === 0) return;
        lightboxIndex = (lightboxIndex + dir + visibleWorks.length) % visibleWorks.length;
        updateLightbox();
    }

    document.getElementById('worksGrid').addEventListener('click', (e) => {
        const card = e.target.closest('.work-card');
        if (!card) return;
        e.preventDefault();
        openLightbox(parseInt(card.dataset.index));
    });

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxPrev').addEventListener('click', () => lightboxNav(-1));
    document.getElementById('lightboxNext').addEventListener('click', () => lightboxNav(1));

    document.getElementById('lightbox').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
        const open = document.getElementById('lightbox').classList.contains('open');
        if (!open) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') lightboxNav(-1);
        if (e.key === 'ArrowRight') lightboxNav(1);
    });

    buildFilter();
    renderWorks();
    buildTicker();
    buildArticles();
</script>
